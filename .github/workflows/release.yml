# ================================================================
#  版本号变更时自动打包并发布 Release
#
#  触发：main 分支每次 push；也可在 Actions 页面手动触发
#  逻辑：比较 server/config/config.json 的 version 字段与上一次提交
#        —— 相同则跳过；不同则跑 scripts/pack.sh 打包 5 个平台的包，
#           上传到 GitHub Release。
#
#  设计要点：
#   1. 版本号唯一来源是 config.json，workflow 不硬编码任何版本字符串，
#      与 pack.sh / build-java.sh 共用同一数据源。
#   2. 首次提交（父提交里还没有 version 字段）视为「有变化」，
#      否则该项目永远不会产出第一个 Release。
#   3. 打包需要联网下载 5 份 JRE（约 250MB），故只在版本真的变了时才跑。
#   4. fetch-depth: 0 —— 需要完整的 git 历史来取上一个提交的内容。
#   5. 保留 workflow_dispatch：改了打包逻辑但版本号没变时（例如修好了
#      包名或包内结构），靠 push 只会走到「跳过」分支，必须能手动重发。
#      force=true 让手动触发绕过版本比较。
#   6. checkout 与 setup-java 均锁在 node24 版本（v7 / v6）。v4 系列跑的是
#      node20，GitHub 已弃用并在强制迁移，会同时报出两条警告：一条是
#      「Node.js 20 is deprecated」，另一条是 setup-java v4 本身已停止
#      维护。升级前查过：v6 的 distribution 仍接受 temurin，
#      java-version 格式未变；checkout v6 起凭据存到 RUNNER_TEMP 下的
#      独立文件，本工作流不做 authenticated git push，不受影响。
# ================================================================

name: Release on version change

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: '忽略版本比较，强制重新打包并发布'
        type: boolean
        default: false

# 打包需要写 dist/、上传 Release 资产，都要求 contents 写权限。
permissions:
  contents: write

jobs:
  release:
    name: 检测版本并发布
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        # v7 起使用 node24 运行时（v4 是 node20，已被 GitHub 弃用并强制
        # 迁移）。v6 起 persist-credentials 把凭据存到 RUNNER_TEMP 下的
        # 独立文件而非 .git/config —— 本工作流只拉代码、不做 authenticated
        # git push，不受影响。
        uses: actions/checkout@v7
        with:
          # 取上一个提交的内容必须要有历史；默认的 depth=1 拿不到 HEAD^。
          fetch-depth: 0

      - name: 比较版本号
        id: check
        run: |
          set -uo pipefail
          CFG="server/config/config.json"

          # 用与 pack.sh 完全相同的 sed 表达式，避免两处解析规则漂移。
          extract_version() {
            sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$1" \
              | head -1
          }

          NEW="$(extract_version "$CFG")"
          echo "当前版本: ${NEW:-<未设置>}"

          if [ -z "$NEW" ]; then
            echo "::error::未能从 $CFG 读到 version 字段，无法判断是否需要发版。"
            exit 1
          fi

          # 父提交。首次提交 / 深度为 1 时没有 HEAD^，当作「无历史版本」。
          PREV=""
          if git rev-parse --verify --quiet HEAD^ >/dev/null; then
            PREV="$(git show "HEAD^:$CFG" 2>/dev/null | {
              extract_version /dev/stdin
            } || true)"
          fi
          echo "上一版本: ${PREV:-<无>}"

          # 手动触发且勾了 force：跳过版本比较。
          # 用于「打包逻辑改了但版本号没变」的场景 —— 这时 push 必然落到
          # 「跳过」分支，只能靠 force 重发。
          FORCE="${{ inputs.force || false }}"

          if [ "$FORCE" = "true" ]; then
            echo "手动强制发布（force=true），忽略版本比较。"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$NEW" >> "$GITHUB_OUTPUT"
            echo "tag=v$NEW" >> "$GITHUB_OUTPUT"
          elif [ "$NEW" = "$PREV" ]; then
            echo "版本未变化（$NEW），跳过打包与发布。"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "版本由 '${PREV:-<无>}' 变为 '$NEW'，将打包并发布。"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$NEW" >> "$GITHUB_OUTPUT"
            echo "tag=v$NEW" >> "$GITHUB_OUTPUT"
          fi

      - name: 检查 Release 是否已存在
        # 仅在版本变化时执行。同一版本重复触发（改代码不改版本号后又推）
        # 不该覆盖既有 Release —— 产物会与该版本首次发布时不一致。
        # 但 force 时允许覆盖：那正是「重新生成这一版的包」的入口。
        if: steps.check.outputs.changed == 'true'
        id: exists
        run: |
          set -uo pipefail
          TAG="${{ steps.check.outputs.tag }}"
          FORCE="${{ inputs.force || false }}"
          if [ "$FORCE" = "true" ]; then
            echo "force=true：若Release $TAG 已存在，将删除后重建。"
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG 已存在，跳过本次发布。"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 准备构建环境
        if: steps.check.outputs.changed == 'true' && steps.exists.outputs.exists == 'false'
        # v6 使用 node24 运行时；v4 已被 GitHub 标记 deprecated
        # （「will no longer receive updates」），会停止修复。
        # v6 的变化对这里均无影响：distribution 仍支持 temurin，
        # java-version 输入格式不变。（v6 把 zulu 的元数据来源从
        # Zulu Discovery API 迁到 Azul Metadata API，与 temurin 无关。）
        uses: actions/setup-java@v6
        with:
          # 显式装 JDK 25：JAR 由 JDK 25 编译（class 版本 69），
          # 低版本 javac 编出来的包目标机跑不了。
          # 不用 apt 的 openjdk-25-jdk-headless —— Ubuntu 24.04 官方源
          # 里没有这个包名，apt install 会直接失败。
          distribution: temurin
          java-version: '25'

      - name: 安装打包依赖
        if: steps.check.outputs.changed == 'true' && steps.exists.outputs.exists == 'false'
        run: |
          sudo apt-get update
          # pack.sh 用 zip 打包、unzip 解压 Windows 的 JRE；
          # python3 用于解析 Adoptium 返回的 JSON（runner 已自带）。
          sudo apt-get install -y zip unzip

      - name: 打包 5 个平台
        if: steps.check.outputs.changed == 'true' && steps.exists.outputs.exists == 'false'
        run: bash scripts/pack.sh

      - name: 上传产物到 Release
        if: steps.check.outputs.changed == 'true' && steps.exists.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.check.outputs.tag }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail

          # 先建 Release（不带资产），再逐个上传。
          #
          # 不用 `gh release create ... dist/*.zip` 一步到位：那样由 gh 自己
          # 从路径推导 asset 名。包名已改为纯 ASCII（hongguo-web-*.zip），
          # 不再受服务端剥中文前缀的影响，但显式给名仍更可控。
          shopt -s nullglob
          zips=(dist/*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "::error::dist/ 下没有任何 zip，打包可能未成功。"
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            # force 重发：先删掉旧 Release。否则 --clobber 只能同名覆盖，
            # 改过包名时旧资产会留在那儿，用户会同时看到两套包。
            if [ "${{ inputs.force || false }}" = "true" ]; then
              echo "force=true：删除既有 Release $TAG 后重建。"
              gh release delete "$TAG" --yes --cleanup-tag
            fi
            gh release create "$TAG" \
              --title "红果web $VERSION" \
              --generate-notes
          else
            gh release create "$TAG" \
              --title "红果web $VERSION" \
              --generate-notes
          fi

          echo "待上传 ${#zips[@]} 个包："
          printf '  %s\n' "${zips[@]}"

          for z in "${zips[@]}"; do
            echo "  -> $(basename "$z")"
            gh release upload "$TAG" "$z" --clobber
          done

      - name: 发布摘要
        if: always()
        run: |
          if [ "${{ steps.check.outputs.changed }}" != "true" ]; then
            echo "**未发布**：版本号未变化。"
          elif [ "${{ steps.exists.outputs.exists }}" = "true" ]; then
            echo "**未发布**：该版本 Release 已存在。"
          else
            echo "**已发布**：${{ steps.check.outputs.tag }} → [查看 Release](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.check.outputs.tag }})"
          fi